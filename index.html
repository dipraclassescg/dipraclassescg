<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dipra Classes CG</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14532d">
<meta name="google-adsense-account" content="ca-pub-2502519038232049">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{--bg:#f4f6f3;--ink:#14231a;--mut:#5b6b60;--card:#fff;--line:#dfe6df;--pri:#14532d;--pri2:#1d7a44;--onpri:#fff;--gold:#e0a526;--ok:#1e9e4f;--okbg:#e0f6e8;--bad:#d63b3b;--badbg:#fce4e4;--hint:#fff4d6;--sh:0 1px 2px rgba(20,35,26,.06),0 4px 14px rgba(20,35,26,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1712;--ink:#e8f1ea;--mut:#9db0a3;--card:#16241c;--line:#26382d;--pri:#6fd09a;--pri2:#3fae70;--onpri:#08170e;--ok:#41c477;--okbg:#153a25;--bad:#ef6b6b;--badbg:#421c1c;--hint:#3a3417;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:"Noto Sans Devanagari","Mukta","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;padding:env(safe-area-inset-top) 0 calc(32px + env(safe-area-inset-bottom))}
.top{background:var(--pri);color:var(--onpri);padding:16px 16px 22px;border-radius:0 0 22px 22px}
.top-in{max-width:640px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--gold);color:#14231a;font-weight:800;display:grid;place-items:center;font-size:1.05rem;letter-spacing:-.5px;flex:none}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:1.2rem;line-height:1.2}
.brand span{font-size:.8rem;opacity:.85}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:inherit;font-size:1.1rem;cursor:pointer}
main{max-width:640px;margin:auto;padding:0 16px}
.stats{display:flex;gap:10px;margin:-14px 0 16px}
.stat{flex:1;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--sh);border:1px solid var(--line)}
.stat b{display:block;font-size:1.2rem;color:var(--pri)}
.stat span{font-size:.78rem;color:var(--mut)}
.src{font-size:.8rem;color:var(--mut);margin:0 2px 12px}
h2{font-size:1rem;margin:4px 2px 10px}
.row{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);font:inherit;color:inherit;text-align:left;cursor:pointer}
.row:active{transform:scale(.985)}
.badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.1rem;color:#fff;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-size:1.02rem}
.row .t span{font-size:.82rem;color:var(--mut)}
.chev{color:var(--mut);font-size:1.3rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
.bar-r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.sm{padding:8px 12px;font-size:.9rem}
.btn.full{width:100%}
.meta{font-size:.8rem;color:var(--mut);text-align:right;line-height:1.35}
.prog{height:6px;border-radius:6px;background:var(--line);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);border-radius:6px;transition:width .3s}
.qc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin:12px 0 14px;box-shadow:var(--sh)}
.q{font-size:1.15rem;font-weight:600;margin:0}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;font:inherit;color:inherit;cursor:pointer}
.opt .l{width:30px;height:30px;border-radius:9px;background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:.9rem;flex:none}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.right .l{background:var(--ok);color:#fff}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt.wrong .l{background:var(--bad);color:#fff}
.opt:disabled{cursor:default;color:inherit}
.hint,.exp{border-radius:14px;padding:12px 14px;margin:10px 0}
.hint{background:var(--hint)}
.exp{background:var(--card);border:1.5px solid var(--ok)}
.hide{display:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h3{margin:0 0 8px;font-size:1rem}
input[type=url],input[type=text]{width:100%;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:8px 0 12px}
ol{padding-left:20px;margin:6px 0}
li{margin-bottom:6px}
.cols{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cols code{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:.85rem}
.msg{border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.92rem}
.msg.ok{background:var(--okbg);border:1px solid var(--ok)}
.msg.err{background:var(--badbg);border:1px solid var(--bad)}
.note{color:var(--mut);font-size:.82rem;margin-top:14px}
.nav{display:flex;gap:10px;margin-top:12px}
.nav .btn{flex:1}.nav .btn:disabled{opacity:.4;cursor:default}
.adwrap{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:8px;margin:0 0 14px;text-align:center;min-height:120px}
.adl{font-size:.7rem;color:var(--mut);letter-spacing:.5px;margin-bottom:4px}
.adph{color:var(--mut);font-size:.85rem;padding:40px 0}
.sumrow{display:flex;gap:10px;margin:8px 0}
.sumrow div{flex:1;background:var(--bg);border-radius:12px;padding:10px;text-align:center}
.sumrow b{display:block;font-size:1.3rem;color:var(--pri)}
.sumrow span{font-size:.75rem;color:var(--mut)}
.rq{font-weight:600;margin-bottom:8px}
.ra{border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.92rem}
.ra.ok{background:var(--okbg);border:1px solid var(--ok)}
.ra.bad{background:var(--badbg);border:1px solid var(--bad)}
.rx{font-size:.88rem;color:var(--mut);margin-top:6px}
.mini{height:6px;border-radius:6px;background:var(--line);overflow:hidden;margin-top:6px}
.mini i{display:block;height:100%;background:var(--ok)}
.pill{display:inline-block;background:var(--badbg);color:var(--bad);border-radius:20px;padding:3px 10px;font-size:.78rem;font-weight:700;margin-top:6px;cursor:pointer}
.pill.g{background:var(--hint);color:#8a6200;cursor:default}
.qrow{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.starb{background:none;border:0;font-size:1.6rem;color:var(--gold);cursor:pointer;line-height:1;padding:0 2px;flex:none}
.star{font-size:1.4rem;color:var(--gold)}
#tm{font-variant-numeric:tabular-nums;font-weight:700}
#tm.over{color:var(--bad)}
.row .t .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.row .t .c{font-size:.8rem;font-weight:700;border-radius:8px;padding:2px 8px;background:var(--bg);color:var(--mut)}
.row .t .c.g{background:var(--okbg);color:var(--ok)}
.row .t .c.b{background:var(--badbg);color:var(--bad)}
.ck{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;cursor:pointer}
.ck input{width:24px;height:24px;accent-color:var(--pri);flex:none;margin:1px 0 0}
.ck a{color:var(--pri);font-weight:700}
.btn:disabled{opacity:.45;cursor:default}
.disc{font-size:.8rem;color:var(--mut);text-align:center;margin:14px 4px 0;line-height:1.5}
.disc a{color:var(--pri);font-weight:700}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="logo">DC</div>
  <div class="brand"><b>Dipra Classes CG</b><span>CGPSC और CGSSB टेस्ट सीरीज़</span></div>
  <button class="ib" id="rf" title="प्रश्न रीफ़्रेश करें" aria-label="रीफ़्रेश">⟳</button>
</div></div>
<main id="app"></main>

<script>
const DEFAULT_SHEET="https://docs.google.com/spreadsheets/d/e/2PACX-1vR8nWWqfN6sdPe9KVDs254GcRpKkg4p1gSgc8D9XpxTxx8S4-H8H_QP3bg7_nlxPgI21yUBPm_ptCOO/pub?output=csv"; // ऐप में पहले से जुड़ी Sheet
const SAMPLE = [];
const add=(sub,arr)=>arr.forEach(x=>SAMPLE.push([sub,...x]));
add("छत्तीसगढ़ सामान्य ज्ञान",[
["छत्तीसगढ़ राज्य का गठन कब हुआ?","1 नवंबर 1999","1 नवंबर 2000","15 अगस्त 2000","26 जनवरी 2001","B","यह तारीख मध्य प्रदेश पुनर्गठन अधिनियम 2000 से जुड़ी है।","छत्तीसगढ़ 1 नवंबर 2000 को मध्य प्रदेश से अलग होकर भारत का 26वाँ राज्य बना।"],
["छत्तीसगढ़ की सबसे लंबी नदी कौन सी है?","शिवनाथ","इंद्रावती","महानदी","हसदेव","C","इसका उद्गम धमतरी जिले की सिहावा पहाड़ी से है।","महानदी छत्तीसगढ़ की सबसे लंबी और प्रमुख नदी है, जो सिहावा की पहाड़ियों से निकलती है।"],
["छत्तीसगढ़ की राजधानी कौन सी है?","बिलासपुर","दुर्ग","नया रायपुर (अटल नगर)","जगदलपुर","C","यह रायपुर के पास बसाया गया नियोजित शहर है।","राज्य की राजधानी नया रायपुर है, जिसे अटल नगर भी कहा जाता है।"],
["छत्तीसगढ़ का राजकीय पशु कौन सा है?","बाघ","हाथी","वन भैंसा","हिरण","C","यह जंगली प्रजाति है और इंद्रावती क्षेत्र में पाई जाती है।","वन भैंसा (जंगली भैंसा) छत्तीसगढ़ का राजकीय पशु है।"],
["छत्तीसगढ़ का राजकीय पक्षी कौन सा है?","मोर","पहाड़ी मैना","तोता","कोयल","B","यह इंसानी आवाज़ की नकल कर सकती है।","बस्तर की पहाड़ी मैना छत्तीसगढ़ का राजकीय पक्षी है।"],
["छत्तीसगढ़ का राजकीय वृक्ष कौन सा है?","सागौन","साल (सरई)","महुआ","आम","B","स्थानीय भाषा में इसे सरई कहते हैं।","साल (सरई) छत्तीसगढ़ का राजकीय वृक्ष है।"],
["चित्रकोट जलप्रपात किस नदी पर स्थित है?","महानदी","शिवनाथ","इंद्रावती","हसदेव","C","इसे भारत का नियाग्रा भी कहा जाता है।","चित्रकोट जलप्रपात बस्तर क्षेत्र में इंद्रावती नदी पर स्थित है।"],
["कांगेर घाटी राष्ट्रीय उद्यान किस क्षेत्र में स्थित है?","सरगुजा","बस्तर","कोरबा","रायगढ़","B","इसी क्षेत्र में तीरथगढ़ जलप्रपात भी है।","कांगेर घाटी राष्ट्रीय उद्यान बस्तर क्षेत्र में स्थित है।"],
["छत्तीसगढ़ को किस नाम से जाना जाता है?","चाय का बागान","धान का कटोरा","मसालों की भूमि","गेहूँ का भंडार","B","यहाँ धान की बहुत किस्में उगाई जाती हैं।","धान की अधिक पैदावार और किस्मों के कारण छत्तीसगढ़ को धान का कटोरा कहा जाता है।"],
["पंथी नृत्य किस समुदाय से संबंधित है?","गोंड","सतनामी","बैगा","कमार","B","यह गुरु घासीदास की शिक्षाओं से जुड़ा है।","पंथी नृत्य सतनामी समुदाय का प्रमुख लोकनृत्य है।"]
]);
add("इतिहास",[
["प्लासी का युद्ध किस वर्ष हुआ था?","1757","1764","1761","1748","A","रॉबर्ट क्लाइव और सिराजुद्दौला के बीच हुआ था।","प्लासी का युद्ध 1757 में हुआ, जिससे बंगाल में अंग्रेजी सत्ता की नींव पड़ी।"],
["बक्सर का युद्ध कब हुआ?","1757","1764","1857","1772","B","प्लासी के सात वर्ष बाद हुआ।","बक्सर का युद्ध 1764 में अंग्रेजों और मीर कासिम, शुजाउद्दौला व शाह आलम की संयुक्त सेना के बीच हुआ।"],
["पानीपत का प्रथम युद्ध (1526) किसके बीच हुआ?","अकबर और हेमू","बाबर और इब्राहिम लोदी","हुमायूँ और शेरशाह","बाबर और राणा सांगा","B","इस युद्ध से मुगल वंश की शुरुआत हुई।","पानीपत के प्रथम युद्ध में बाबर ने इब्राहिम लोदी को हराकर मुगल साम्राज्य की नींव रखी।"],
["कलिंग युद्ध के बाद अशोक ने कौन सा धर्म अपनाया?","जैन धर्म","बौद्ध धर्म","हिंदू धर्म","आजीविक","B","युद्ध की हिंसा देखकर उसका हृदय परिवर्तन हुआ।","कलिंग युद्ध (261 ई.पू.) के बाद अशोक ने बौद्ध धर्म अपना लिया।"],
["भारत छोड़ो आंदोलन किस वर्ष शुरू हुआ?","1930","1940","1942","1946","C","द्वितीय विश्व युद्ध के दौरान शुरू हुआ था।","भारत छोड़ो आंदोलन 8 अगस्त 1942 को बंबई अधिवेशन से शुरू हुआ।"],
["जलियाँवाला बाग हत्याकांड कब हुआ?","1919","1920","1922","1930","A","रौलेट एक्ट के विरोध से जुड़ा है।","जलियाँवाला बाग हत्याकांड 13 अप्रैल 1919 को अमृतसर में हुआ, जनरल डायर इसके जिम्मेदार थे।"],
["हड़प्पा सभ्यता के स्थल हड़प्पा की खोज किसने की?","दयाराम साहनी","जॉन मार्शल","आर.डी. बनर्जी","मॉर्टिमर व्हीलर","A","खोज 1921 में हुई थी।","हड़प्पा की खोज 1921 में दयाराम साहनी ने की, जबकि मोहनजोदड़ो की खोज आर.डी. बनर्जी ने की।"],
["मुगल वंश का संस्थापक कौन था?","अकबर","हुमायूँ","बाबर","शाहजहाँ","C","पानीपत का प्रथम युद्ध जीतकर आया था।","बाबर ने 1526 में मुगल वंश की स्थापना की।"],
["1857 का विद्रोह सबसे पहले कहाँ से शुरू हुआ?","दिल्ली","कानपुर","झाँसी","मेरठ","D","यह उत्तर प्रदेश का एक छावनी शहर है।","1857 का विद्रोह 10 मई 1857 को मेरठ की छावनी से शुरू हुआ।"],
["गांधीजी ने दांडी मार्च कब किया?","1919","1930","1942","1920","B","नमक कानून तोड़ने के लिए किया गया।","दांडी मार्च 12 मार्च 1930 को साबरमती आश्रम से शुरू हुआ और सविनय अवज्ञा आंदोलन की शुरुआत हुई।"]
]);
add("राजव्यवस्था",[
["'जीवन एवं दैहिक स्वतंत्रता' का अधिकार किस अनुच्छेद में है?","अनुच्छेद 14","अनुच्छेद 19","अनुच्छेद 21","अनुच्छेद 32","C","यह मौलिक अधिकारों के भाग III में आता है; संख्या 20 के बाद की है।","अनुच्छेद 21 प्राण और दैहिक स्वतंत्रता की रक्षा करता है।"],
["भारतीय संविधान कब लागू हुआ?","15 अगस्त 1947","26 नवंबर 1949","26 जनवरी 1950","26 जनवरी 1949","C","इसी दिन को हम गणतंत्र दिवस मनाते हैं।","संविधान 26 नवंबर 1949 को अपनाया गया और 26 जनवरी 1950 को लागू हुआ।"],

async function fetchOne(u){
  const r=await fetch(u,{cache:"no-store"});
  if(!r.ok) throw new Error("http "+r.status);
  const t=await r.text();
  if(/^\s*<(!doctype|html)/i.test(t)) throw new Error("private");
  return t;
}
async function fetchCsv(v){
  const c=[toCsvUrl(v)];
  const m=v.match(/\/spreadsheets\/d\/([\w-]+)/);
  if(m&&!/\/spreadsheets\/d\/e\//.test(v)){
    c.push("https://docs.google.com/spreadsheets/d/"+m[1]+"/export?format=csv");
    c.push("https://docs.google.com/spreadsheets/d/"+m[1]+"/gviz/tq?tqx=out:csv");
  }
  let err;
  for(const u of [...new Set(c)]){
    try{ return await fetchOne(u) }catch(e){ err=e }
  }
  throw err;
}
function errText(e){
  const m=String(e&&e.message||e);
  if(m==="private") return "Sheet का लिंक खुला, पर Google ने लॉगिन पेज दिया। Sheet को पब्लिक करें: Share → Anyone with the link → Viewer, या Publish to web (CSV) दोबारा करें।";
  if(/^http/.test(m)) return "Google ने त्रुटि दी ("+m+"). लिंक पूरा कॉपी हुआ है या नहीं जाँचें; Publish to web में फ़ॉर्मेट CSV होना चाहिए।";
  return "ब्राउज़र ने Sheet तक पहुँचने नहीं दिया या इंटरनेट बंद है। (डाउनलोड की हुई फ़ाइल या Preview में यह आम है।) नीचे दिए 'CSV फ़ाइल से लोड करें' विकल्प से प्रश्न लोड करें, या ऐप को https लिंक पर होस्ट करें।";
}
const count=b=>Object.values(b).reduce((s,a)=>s+a.length,0);

const PK="cgem_prog_v1";
const MINW=5, SECQ=72; // 72 सेकंड प्रति प्रश्न (15 प्रश्न = 18 मिनट)
let P=(()=>{try{const o=JSON.parse(LS(PK)||"null");if(o&&o.sub&&Array.isArray(o.bm))return o}catch(e){}return {u:0,sub:{},bm:[]}})();
const save=()=>LSset(PK,JSON.stringify(P));
const SP=s=>(P.sub[s] ||= {r:0,w:0,s:0,done:[],cyc:[],wr:[]});
const hk=(s,q)=>{let h=5381;const t=s+"|"+String(q).trim();for(let i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;return (h>>>0).toString(36)};
let idx={};
function indexBank(){ idx={}; Object.keys(bank).forEach(s=>bank[s].forEach(x=>{x.k=hk(s,x.q);x.s=s;idx[x.k]=x})); }
function toggleBm(k){const i=P.bm.indexOf(k); if(i>=0)P.bm.splice(i,1); else P.bm.push(k); save(); return i<0}

let tickId=null;
function fmtT(s){const a=Math.abs(s),m=Math.floor(a/60),r=a%60;return (s<0?"−":"")+String(m).padStart(2,"0")+":"+String(r).padStart(2,"0")}
function paintT(){ const el=document.getElementById("tm"); if(!el||!quiz) return; const rem=Math.ceil(quiz.blk*SECQ-quiz.tel); el.textContent=fmtT(rem); el.className=rem<0?"over":""; }
function stopTick(){ if(tickId){clearInterval(tickId);tickId=null} }
function startTick(){ stopTick(); quiz.lt=Date.now(); tickId=setInterval(()=>{ if(!quiz){stopTick();return} const n=Date.now(),d=(n-quiz.lt)/1000; quiz.lt=n; if(quiz.timing&&!document.hidden&&d<3) quiz.tel+=d; paintT(); },500); }

  const url=DEFAULT_SHEET; let ok=false, err="";

    try{

  const subs=Object.keys(bank);

  subs.forEach(s=>{const p=P.sub[s]; if(p){tr+=p.r;tw+=p.w}});
  const att=tr+tw, pct=att?Math.round(tr*100/att):0;
  const bmN=P.bm.filter(k=>idx[k]).length;
  app.innerHTML=`<div class="stats"><div class="stat"><b>${att}</b><span>प्रश्न हल</span></div><div class="stat"><b>${att?pct+"%":"–"}</b><span>सही उत्तर</span></div><div class="stat"><b>${fmt(P.u)}</b><span>कुल अंक</span></div></div>
  <h2>विषय चुनें</h2>`+
  subs.map((s,i)=>{
    const p=P.sub[s], n=bank[s].length, ds=new Set(p?p.done:[]), ws=new Set(p?p.wr:[]);
    const done=bank[s].filter(x=>ds.has(x.k)).length, wn=bank[s].filter(x=>ws.has(x.k)).length;
    return `<div class="row" data-i="${i}" role="button"><div class="badge" style="background:${COLORS[i%COLORS.length]}">${esc([...s][0])}</div><div class="t"><b>${esc(s)}</b>${done?`<div class="chips"><span class="c">हल ${done}</span><span class="c g">✓ सही ${p.r}</span><span class="c b">✗ गलत ${p.w}</span></div>`:`<span>अभी शुरू नहीं किया</span>`}${wn?`<span class="pill" data-w="${i}">↻ गलत दोहराएँ (${wn})</span>`:""}</div><span class="chev">›</span></div>`;
  }).join("")+
  `<div class="row" id="bmrow" role="button" style="justify-content:center"><span class="star">★</span><b>सहेजे प्रश्न (${bmN})</b></div>
  <p class="note" style="text-align:center">प्रश्न मिले-जुले क्रम में आते हैं। किसी विषय के सारे प्रश्न आने के बाद ही कोई प्रश्न दोबारा आता है।</p>
  <p class="disc">यह एक निजी अभ्यास ऐप है। इसका CGPSC, CGSSB या किसी भी सरकारी संस्था से कोई संबंध नहीं है।<br><a href="${POLICY}" target="_blank" rel="noopener">प्राइवेसी पॉलिसी</a></p>
  <p class="note" style="text-align:center" id="rsw"><a href="#" id="rs" style="color:var(--mut)">प्रगति रीसेट करें</a></p>`;
  app.querySelectorAll(".row[data-i]").forEach(b=>b.onclick=()=>start(subs[b.dataset.i],"n"));
  app.querySelectorAll(".pill[data-w]").forEach(b=>b.onclick=ev=>{ev.stopPropagation();start(subs[b.dataset.w],"w")});
  document.getElementById("bmrow").onclick=bmView;
  document.getElementById("rs").onclick=ev=>{
    ev.preventDefault();
    document.getElementById("rsw").innerHTML='सारी प्रगति मिट जाएगी, पक्का? <button class="btn sm" id="rsy">हाँ, रीसेट करें</button> <button class="btn ghost sm" id="rsn">नहीं</button>';
    document.getElementById("rsy").onclick=()=>{P={u:0,sub:{},bm:[]};save();home()};
    document.getElementById("rsn").onclick=home;
  };
}

function bmView(){
  pushS();
  const items=P.bm.map(k=>idx[k]).filter(Boolean);
  app.innerHTML=`<div class="bar"><button class="btn sm" id="back">← होम</button></div><h2>★ सहेजे प्रश्न (${items.length})</h2>`+
  (items.length?items.map(x=>`<div class="card"><div class="qrow"><div class="rq">${esc(x.q)}</div><button class="starb on" data-k="${x.k}">★</button></div><div class="ra ok">✓ सही उत्तर: ${L[x.a]}. ${esc(x.o[x.a])}</div>${x.e?`<div class="rx">${esc(x.e)}</div>`:""}<div class="note" style="margin-top:6px">${esc(x.s)}</div></div>`).join(""):`<div class="card">अभी कोई प्रश्न सहेजा नहीं है। प्रश्न के कोने में ☆ दबाकर सहेजें।</div>`);
  document.getElementById("back").onclick=goHome;
  app.querySelectorAll(".starb").forEach(b=>b.onclick=()=>{toggleBm(b.dataset.k);bmView()});
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(sub,mode){
  const qs=bank[sub];
  quiz={sub,qs,mode:mode||"n",bag:[],round:0,units:0,last:-1,log:[],pos:-1,bs:0,queue:[],blk:BLOCK,tel:0,timing:false,lt:0};
  if(quiz.mode==="w"){
    const w=new Set(SP(sub).wr);
    quiz.queue=shuffle(qs.map((x,i)=>w.has(x.k)?i:-1).filter(i=>i>=0));
    if(!quiz.queue.length){home();return}
  }
  pushS(); newBlock(); advance();
}
function newBlock(){
  quiz.bs=quiz.log.length;
  quiz.blk=quiz.mode==="w"?Math.min(BLOCK,quiz.queue.length):BLOCK;
  quiz.tel=0; quiz.timing=true; startTick();
}
function nextQ(){
  if(quiz.mode==="w") return quiz.queue.shift();
  const n=quiz.qs.length, sp=SP(quiz.sub);
  if(!quiz.bag.length){
    const cyc=new Set(sp.cyc);
    let cand=[...Array(n).keys()].filter(i=>!cyc.has(quiz.qs[i].k));
    if(!cand.length){ sp.cyc=[]; cand=[...Array(n).keys()]; quiz.round++ }
    shuffle(cand);
    if(cand.length>1&&cand[cand.length-1]===quiz.last){[cand[0],cand[cand.length-1]]=[cand[cand.length-1],cand[0]]}
    quiz.bag=cand;
  }
  const c=quiz.bag.pop(); quiz.last=c;
  sp.cyc.push(quiz.qs[c].k); save();
  return c;
}
function advance(){ quiz.log.push({i:nextQ(),pick:null,pts:0}); quiz.pos=quiz.log.length-1; show(); }

function show(){
  const e=quiz.log[quiz.pos], q=quiz.qs[e.i], answered=e.pick!=null;
  const inBlock=quiz.log.length-quiz.bs, pib=quiz.pos-quiz.bs+1;
  const endOfBlock=quiz.pos===quiz.log.length-1&&inBlock>=quiz.blk;
  const isBm=P.bm.indexOf(q.k)>=0;
  app.innerHTML=`<div class="bar"><div class="bar-r"><button class="btn sm" id="back">← विषय बदलें</button><div class="meta">${esc(quiz.sub)}${quiz.mode==="w"?" · गलत दोहराव":""}<br>अंक <b id="sc">${fmt(quiz.units)}</b> · प्रश्न ${pib}/${quiz.blk}<br>⏱ <span id="tm">--:--</span></div></div><div class="prog"><i style="width:${pib/quiz.blk*100}%"></i></div></div>
  <div class="qc"><div class="qrow"><p class="q">${esc(q.q)}</p><button class="starb ${isBm?"on":""}" id="bm" aria-label="सहेजें">${isBm?"★":"☆"}</button></div>${quiz.mode==="w"?'<span class="pill g">पहले गलत हुआ था</span>':""}</div>
  ${q.o.map((t,i)=>`<button class="opt" data-k="${i}"><span class="l">${L[i]}</span><span>${esc(t)}</span></button>`).join("")}
  <button class="btn ghost sm" id="hb">💡 संकेत देखें</button>
  <div class="hint hide" id="hint">${esc(q.h||"इस प्रश्न के लिए संकेत उपलब्ध नहीं है।")}</div>
  <div class="exp hide" id="exp"><b>व्याख्या:</b> ${esc(q.e||"व्याख्या उपलब्ध नहीं है।")}</div>
  <div class="nav"><button class="btn ghost" id="prev" ${quiz.pos>quiz.bs?"":"disabled"}>‹ पिछला प्रश्न</button><button class="btn ghost ${answered?"hide":""}" id="skip">छोड़ें ⏭</button><button class="btn hide" id="next">${endOfBlock?inBlock+" पूरे · आगे →":"अगला प्रश्न ›"}</button></div>`;
  window.scrollTo(0,0);
  const opts=app.querySelectorAll(".opt"), $=id=>document.getElementById(id);
  const lock=()=>{
    opts[q.a].classList.add("right");
    if(e.pick>=0&&e.pick!==q.a) opts[e.pick].classList.add("wrong");
    opts.forEach(o=>o.disabled=true);
    $("exp").classList.remove("hide"); $("next").classList.remove("hide"); $("skip").classList.add("hide");
  };
  if(answered) lock();
  paintT();
  $("back").onclick=goHome;
  $("hb").onclick=()=>$("hint").classList.toggle("hide");
  $("bm").onclick=()=>{const on=toggleBm(q.k);$("bm").textContent=on?"★":"☆";$("bm").classList.toggle("on",on)};
  opts.forEach(b=>b.onclick=()=>{
    if(e.pick!=null) return;
    e.pick=+b.dataset.k; e.pts=e.pick===q.a?6:-2; quiz.units+=e.pts;
    const sp=SP(quiz.sub);
    if(quiz.mode==="n"){ if(e.pick===q.a) sp.r++; else sp.w++; }
    P.u+=e.pts; // दोहराव के अंक भी कुल अंक में जुड़ते हैं
    if(sp.done.indexOf(q.k)<0) sp.done.push(q.k);
    const wi=sp.wr.indexOf(q.k);
    if(e.pick===q.a){ if(wi>=0) sp.wr.splice(wi,1) } else if(wi<0) sp.wr.push(q.k);
    save();
    $("sc").textContent=fmt(quiz.units); lock();
    $("next").scrollIntoView({block:"nearest",behavior:"smooth"});
  });
  $("prev").onclick=()=>{ if(quiz.pos>quiz.bs){quiz.pos--;show()} };
  const goNext=()=>{
    if(quiz.pos<quiz.log.length-1){quiz.pos++;show();return}
    if(quiz.log.length-quiz.bs>=quiz.blk){finishBlock();return}
    advance();
  };
  $("next").onclick=goNext;
  $("skip").onclick=()=>{
    if(e.pick!=null) return; e.pick=-1; e.pts=0;
    if(quiz.mode==="n"){ SP(quiz.sub).s++; save(); }
    goNext();
  };
}

function finishBlock(){
  quiz.timing=false;
  if(quiz.mode==="w"&&quiz.blk<MINW) review(); else adScreen();
}

function adScreen(){
  app.innerHTML=`<div class="bar"><button class="btn sm" id="back">← विषय बदलें</button></div>
  <div class="card" style="text-align:center"><div style="font-size:2rem">🎯</div><h3>${quiz.blk} प्रश्न पूरे हुए!</h3><div style="color:var(--mut);font-size:.9rem">उत्तर और व्याख्या देखने के लिए नीचे दबाएँ</div></div>
  ${adBox()}
  <button class="btn full" id="see">उत्तर देखें →</button>`;
  window.scrollTo(0,0); runAd();
  document.getElementById("back").onclick=goHome;
  document.getElementById("see").onclick=()=>{
    // Android ऐप में: पहले पूरी स्क्रीन का विज्ञापन, उसके बंद होने पर उत्तर
    if(NATIVE&&window.AndroidAds&&!window.__adBusy){
      window.__adBusy=true;
      let done=false;
      const go=()=>{ if(done) return; done=true; window.__adBusy=false; window.onAdDone=null; review(); };
      window.onAdDone=go;
      setTimeout(go,15000); // सुरक्षा: विज्ञापन अटके तो भी उत्तर खुल जाएँ
      try{ window.AndroidAds.showInterstitial(); }catch(e){ go(); }
    } else review();
  };
}

function review(){
  const ents=quiz.log.slice(quiz.bs); let r=0,w=0,sk=0,u=0;
  ents.forEach(e=>{ if(e.pick==null||e.pick<0){sk++;return} if(e.pick===quiz.qs[e.i].a)r++; else w++; u+=e.pts });
  const used=Math.round(quiz.tel), lim=quiz.blk*SECQ, over=used>lim;
  const left=quiz.mode==="w"?quiz.queue.length:1;
  const nextN=quiz.mode==="w"?Math.min(BLOCK,quiz.queue.length):BLOCK;
  app.innerHTML=`<div class="bar"><button class="btn sm" id="back">← विषय बदलें</button></div>
  <div class="card"><h3>इन ${ents.length} प्रश्नों का परिणाम${quiz.mode==="w"?" (गलत दोहराव)":""}</h3>
    <div class="sumrow"><div><b>${r}</b><span>सही (+2)</span></div><div><b>${w}</b><span>गलत (−⅔)</span></div><div><b>${sk}</b><span>छोड़े (0)</span></div><div><b>${fmt(u)}</b><span>अंक</span></div></div>
    <div style="font-size:.9rem;color:var(--mut)">⏱ समय: <b${over?' style="color:var(--bad)"':""}>${fmtT(used)}</b> / ${fmtT(lim)}${over?" · समय सीमा से अधिक":""}</div>
    <div style="font-size:.9rem;color:var(--mut)">अब तक कुल अंक: <b>${fmt(P.u)}</b></div></div>
  ${ents.map((e,k)=>{const q=quiz.qs[e.i],ok=e.pick===q.a;
    return `<div class="card"><div class="rq">${k+1}. ${esc(q.q)}</div>`+
    (e.pick==null||e.pick<0?`<div class="ra">⏭ छोड़ा गया</div><div class="ra ok">✓ सही उत्तर: ${L[q.a]}. ${esc(q.o[q.a])}</div>`:ok?`<div class="ra ok">✓ आपका उत्तर सही: ${L[q.a]}. ${esc(q.o[q.a])}</div>`:
        `<div class="ra bad">✗ आपका उत्तर: ${L[e.pick]}. ${esc(q.o[e.pick])}</div><div class="ra ok">✓ सही उत्तर: ${L[q.a]}. ${esc(q.o[q.a])}</div>`)+
    (q.e?`<div class="rx">${esc(q.e)}</div>`:"")+`</div>`}).join("")}
  <button class="btn full" id="more">${left?`अगले ${nextN} प्रश्न →`:"✓ सारे गलत प्रश्न पूरे · होम"}</button>`;
  window.scrollTo(0,0);
  document.getElementById("back").onclick=goHome;
  document.getElementById("more").onclick=()=>{ if(!left){goHome();return} newBlock(); advance(); };
}

function gate(){
  if(LS(OKK)==="1"){ load(); return }
  app.innerHTML=`<div class="card" style="margin-top:18px"><h3>स्वागत है 👋</h3><div style="color:var(--mut);font-size:.92rem">जारी रखने के लिए प्राइवेसी पॉलिसी पढ़ें और नीचे टिक करें।</div></div>
  <label class="ck"><input type="checkbox" id="ckb"><span>मैंने <a href="${POLICY}" target="_blank" rel="noopener">प्राइवेसी पॉलिसी</a> पढ़ ली है और मैं उससे सहमत हूँ।</span></label>
  <button class="btn full" id="go" disabled>स्वीकार करें और शुरू करें</button>
  <p class="note" style="text-align:center">यह स्क्रीन सिर्फ़ पहली बार दिखेगी।</p>`;
  const ckb=document.getElementById("ckb"), go=document.getElementById("go");
  ckb.onchange=()=>{go.disabled=!ckb.checked};
  go.onclick=()=>{ if(!ckb.checked) return; LSset(OKK,"1"); load(); };
}
document.getElementById("rf").onclick=()=>{ if(LS(OKK)==="1") load(); };
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
gate();
</script>
</body>
</html>
